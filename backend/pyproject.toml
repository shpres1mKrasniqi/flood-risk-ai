[project]
name = "flood-risk-prediction-api"
version = "0.1.0"
description = "AI-assisted flood risk prediction API for Kosovo"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "openai>=3.22.1",
    "pandas>=3.0.6",
    "pydantic-settings>=2.15.0",
    "scikit-learn==1.9.1",
]

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
ml = [
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
